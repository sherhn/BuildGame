<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стройка мечты - Результат</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Упрощенные стили для страницы результатов */
        .game-container {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
            z-index: 10;
        }

        .end-screen {
            background-color: var(--ui-bg);
            border: 5px solid var(--ui-border);
            padding: 25px;
            text-align: center;
            width: 100%;
            margin: 0 auto;
            border-radius: 8px;
        }

        .end-content {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 25px;
            text-align: left;
            margin: 20px 0;
            width: 100%;
        }

        .final-house-container {
            height: 350px;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid #000;
            border-radius: 5px;
        }

        .end-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .end-stat {
            background-color: rgba(0, 0, 0, 0.3);
            border: 3px solid var(--ui-border);
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .end-stat-value {
            font-size: 1.5rem;
            margin: 8px 0;
        }

        .end-stat-label {
            font-size: 0.75rem;
            color: #aaa;
        }

        .parameter-rating {
            background-color: rgba(0,0,0,0.3);
            padding: 15px;
            border: 3px solid var(--ui-border);
            margin-top: 15px;
            border-radius: 6px;
        }

        .parameter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .parameter-item {
            padding: 12px;
            border-radius: 5px;
        }

        .quest-badge {
            background-color: rgba(255, 215, 0, 0.15);
            border: 2px solid var(--warning);
            padding: 6px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 12px;
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .end-content {
                grid-template-columns: 1fr;
            }

            .end-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .parameter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Упрощенный фон -->
    <div class="terraria-bg">
        <div class="sky-bg">
            <div class="sun"></div>
            <div class="pixel-cloud cloud-1"></div>
            <div class="pixel-cloud cloud-2"></div>
        </div>
        <div class="mountain-range">
            <div class="mountain mountain-1"></div>
            <div class="mountain mountain-2"></div>
            <div class="mountain mountain-3"></div>
            <div class="mountain mountain-4"></div>
        </div>
        <div class="bg-tree bg-tree-1">
            <div class="bg-tree-trunk"></div>
            <div class="bg-tree-crown"></div>
        </div>
        <div class="bg-tree bg-tree-2">
            <div class="bg-tree-trunk"></div>
            <div class="bg-tree-crown"></div>
        </div>
        <div class="bg-tree bg-tree-3">
            <div class="bg-tree-trunk"></div>
            <div class="bg-tree-crown"></div>
        </div>
        <div class="detailed-ground"></div>
        <div class="pixel-grid"></div>
    </div>

    <div class="game-container">
        <div class="end-screen">
            <h2 class="end-title" id="end-title">Строительство завершено!</h2>

            <div id="quest-badge" class="quest-badge" style="display: none;">
                <i class="fas fa-scroll"></i> Режим задания
            </div>

            <div class="end-content">
                <div class="final-house-container" id="final-house">
                    <div class="house-bg"></div>
                    <div class="pixel-block foundation"></div>
                    <div class="pixel-block walls"></div>
                    <div class="pixel-block roof"></div>
                    <div class="pixel-block window window-left"></div>
                    <div class="pixel-block window window-right"></div>
                    <div class="pixel-block door"></div>
                    <div class="pixel-block chimney"></div>
                    <div class="pixel-block fence">
                        <div class="fence-post"></div>
                        <div class="fence-post"></div>
                        <div class="fence-post"></div>
                        <div class="fence-post"></div>
                        <div class="fence-post"></div>
                    </div>
                    <div class="pixel-block tree">
                        <div class="tree-trunk"></div>
                        <div class="tree-crown"></div>
                    </div>
                </div>

                <div>
                    <div class="end-result" id="end-result">
                        Поздравляем! Вы успешно построили дом, балансируя между бюджетом, прочностью, долговечностью и сроками.
                    </div>

                    <div class="end-stats">
                        <div class="end-stat">
                            <div class="end-stat-label">Остаток бюджета</div>
                            <div class="end-stat-value" id="final-money" style="color: var(--success);">0</div>
                        </div>
                        <div class="end-stat">
                            <div class="end-stat-label">Итоговая прочность</div>
                            <div class="end-stat-value" id="final-strength" style="color: var(--danger);">0</div>
                        </div>
                        <div class="end-stat">
                            <div class="end-stat-label">Итоговая долговечность</div>
                            <div class="end-stat-value" id="final-durability" style="color: var(--primary);">0</div>
                        </div>
                        <div class="end-stat">
                            <div class="end-stat-label">Осталось дней</div>
                            <div class="end-stat-value" id="final-time" style="color: var(--time-color);">0</div>
                        </div>
                    </div>

                    <div class="parameter-rating">
                        <h3 style="color: var(--warning); margin-bottom: 12px; font-size: 0.9rem; text-align: center;">
                            Оценка параметров:
                        </h3>
                        <div class="parameter-grid">
                            <div class="parameter-item" style="background-color: rgba(255,69,0,0.1); border: 1px solid rgba(255,69,0,0.3);">
                                <div style="color: #fff; margin-bottom: 6px; font-size: 0.85rem;">
                                    <i class="fas fa-shield-alt"></i> Прочность: <span id="final-strength-text">0</span>%
                                </div>
                                <div style="color: #aaa; font-size: 0.75rem;" id="strength-rating"></div>
                            </div>
                            <div class="parameter-item" style="background-color: rgba(123,104,238,0.1); border: 1px solid rgba(123,104,238,0.3);">
                                <div style="color: #fff; margin-bottom: 6px; font-size: 0.85rem;">
                                    <i class="fas fa-hourglass-half"></i> Долговечность: <span id="final-durability-text">0</span>%
                                </div>
                                <div style="color: #aaa; font-size: 0.75rem;" id="durability-rating"></div>
                            </div>
                            <div class="parameter-item" style="background-color: rgba(255,165,0,0.1); border: 1px solid rgba(255,165,0,0.3);">
                                <div style="color: #fff; margin-bottom: 6px; font-size: 0.85rem;">
                                    <i class="fas fa-clock"></i> Сроки: <span id="final-time-text">0</span>%
                                </div>
                                <div style="color: #aaa; font-size: 0.75rem;" id="time-rating"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="game-button" id="play-again-btn" style="margin-top: 20px;">
                Играть снова
            </button>
            <button class="game-button" id="new-quest-btn" style="margin-top: 10px; margin-left: 10px; background-color: var(--warning);">
                <i class="fas fa-scroll"></i> Новое задание
            </button>
        </div>
    </div>

    <script>
        // DOM элементы
        const endTitle = document.getElementById('end-title');
        const endResult = document.getElementById('end-result');
        const finalMoney = document.getElementById('final-money');
        const finalStrength = document.getElementById('final-strength');
        const finalDurability = document.getElementById('final-durability');
        const finalTime = document.getElementById('final-time');
        const finalStrengthText = document.getElementById('final-strength-text');
        const finalDurabilityText = document.getElementById('final-durability-text');
        const finalTimeText = document.getElementById('final-time-text');
        const strengthRating = document.getElementById('strength-rating');
        const durabilityRating = document.getElementById('durability-rating');
        const timeRating = document.getElementById('time-rating');
        const finalHouse = document.getElementById('final-house');
        const playAgainBtn = document.getElementById('play-again-btn');
        const newQuestBtn = document.getElementById('new-quest-btn');
        const questBadge = document.getElementById('quest-badge');

        // Форматирование чисел с разделителями
        function formatNumber(num) {
            return new Intl.NumberFormat('ru-RU').format(num);
        }

        // Загрузка результатов
        function loadResults() {
            const money = localStorage.getItem('finalMoney') || 0;
            const strength = localStorage.getItem('finalStrength') || 0;
            const durability = localStorage.getItem('finalDurability') || 0;
            const time = localStorage.getItem('finalTime') || 0;
            const title = localStorage.getItem('finalTitle') || "Строительство завершено!";
            const result = localStorage.getItem('finalResult') || "Результаты не найдены.";
            const maxTime = localStorage.getItem('maxTime') || 90;
            const wasQuest = localStorage.getItem('wasQuest') === 'true';

            // Показываем бейдж задания если был режим задания
            if (wasQuest) {
                questBadge.style.display = 'inline-block';
            }

            // Отображаем данные
            endTitle.textContent = title;
            endResult.textContent = result;
            finalMoney.textContent = formatNumber(money);
            finalStrength.textContent = strength;
            finalDurability.textContent = durability;
            finalTime.textContent = Math.max(0, time);

            // Оценка параметров
            const strengthPercent = Math.min(100, parseInt(strength));
            const durabilityPercent = Math.min(100, parseInt(durability));
            const timePercent = Math.max(0, Math.min(100, (time / maxTime) * 100));

            finalStrengthText.textContent = strengthPercent;
            finalDurabilityText.textContent = durabilityPercent;
            finalTimeText.textContent = timePercent.toFixed(0);

            // Текстовые оценки
            let strengthRatingText = "";
            let durabilityRatingText = "";
            let timeRatingText = "";

            if (strengthPercent >= 80) {
                strengthRatingText = "Отличная прочность!";
            } else if (strengthPercent >= 50) {
                strengthRatingText = "Хорошая прочность.";
            } else {
                strengthRatingText = "Слабая прочность.";
            }

            if (durabilityPercent >= 80) {
                durabilityRatingText = "Отличная долговечность!";
            } else if (durabilityPercent >= 50) {
                durabilityRatingText = "Хорошая долговечность.";
            } else {
                durabilityRatingText = "Низкая долговечность.";
            }

            if (timePercent >= 50) {
                timeRatingText = "Отличный результат!";
            } else if (timePercent >= 20) {
                timeRatingText = "Хороший результат.";
            } else if (timePercent >= 0) {
                timeRatingText = "Еле уложились в срок.";
            } else {
                timeRatingText = "Сроки сорваны.";
            }

            strengthRating.textContent = strengthRatingText;
            durabilityRating.textContent = durabilityRatingText;
            timeRating.textContent = timeRatingText;

            // Визуальные эффекты для дома
            if (title.includes("Банкротство") || title.includes("Обрушение") || title.includes("Разрушение") || title.includes("Просрочка")) {
                finalHouse.style.opacity = "0.5";
            } else if (strengthPercent < 50 || durabilityPercent < 50 || timePercent < 0) {
                finalHouse.style.opacity = "0.7";
            } else if (strengthPercent >= 80 && durabilityPercent >= 80 && timePercent >= 50) {
                finalHouse.style.opacity = "1";
                finalHouse.style.borderColor = "#32CD32";

                if (wasQuest) {
                    finalHouse.style.borderColor = "#FFD700";
                }
            }
        }

        // Кнопка "Играть снова"
        playAgainBtn.addEventListener('click', function() {
            window.location.href = 'index.html';
        });

        // Кнопка "Новое задание"
        newQuestBtn.addEventListener('click', function() {
            localStorage.removeItem('isQuest');
            localStorage.removeItem('questGenerated');
            localStorage.removeItem('successfulPath');
            window.location.href = 'index.html';
        });

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
